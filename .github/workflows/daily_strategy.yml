name: Daily Strategy Backtest

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "strategies/**"
      - "research/**"
      - "engine/**"
      - "analytics/**"
      - "exchange/**"
      - "main.py"
      - "config/settings.yaml"

jobs:
  daily-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run all strategies and produce report
        run: python scripts/daily_run.py
      - name: Upload daily artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-strategy-results
          path: results/
